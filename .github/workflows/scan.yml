name: DealScanner Bot Auto

on:
  schedule:
    - cron: '0 * * * *' # S'exécute toutes les heures
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4

      - name: Lancer le script de recherche
        run: python scraper.py

      - name: Sauvegarder les résultats sur le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json seen_ads.json
          git commit -m "Mise à jour automatique des annonces [skip ci]" || exit 0
          git push
