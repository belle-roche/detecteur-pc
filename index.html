<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealScanner Pro — Live 10s & Favoris</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0284c7', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-sky-500/10 text-sky-400 rounded-lg border border-sky-500/20">
          <i data-lucide="radar" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white flex items-center gap-2">
            DealScanner Pro
            <span class="text-xs font-mono px-2 py-0.5 bg-sky-500/20 text-sky-300 rounded border border-sky-500/30">Live 10s + Favoris</span>
          </h1>
          <p class="text-xs text-slate-400">Monitoring multi-catégories & auto-refresh</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="manualReload()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition shadow">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Reload (10s)
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- Onglets de Catégories -->
    <div class="flex flex-wrap items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800">
      <button onclick="switchCategory('all')" id="btn-cat-all" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white transition">Tout voir</button>
      <button onclick="switchCategory('pc')" id="btn-cat-pc" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">🖥️ Upgrade PC Base</button>
      <button onclick="switchCategory('new_add')" id="btn-cat-new_add" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">⚡ Nouveaux Ajouts (Intel/GPU)</button>
      <button onclick="switchCategory('vinyl')" id="btn-cat-vinyl" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">🎵 Vinyles</button>
      <button onclick="switchCategory('favorites')" id="btn-cat-favorites" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-amber-400 hover:bg-slate-700 transition flex items-center gap-1">
        <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400"></i> Favoris (<span id="fav-counter">0</span>)
      </button>
    </div>

    <!-- Barre de recherche -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between items-center gap-4">
      <div class="relative flex-1 max-w-md">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
        <input type="text" id="feed-search" onkeyup="renderFeed()" placeholder="Rechercher dans les annonces..." class="bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500 w-full">
      </div>
      <span id="refresh-timer" class="text-[11px] text-slate-500 font-mono">Prochain scan auto dans 10s</span>
    </div>

    <!-- Table des annonces -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-sm font-semibold text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Flux en direct
        </h2>
        <span id="active-count" class="text-xs text-slate-400">0 annonces affichées</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-950 text-slate-400 font-semibold border-b border-slate-800 uppercase tracking-wider">
            <tr>
              <th class="px-4 py-3 w-10">Fav</th>
              <th class="px-4 py-3">Statut</th>
              <th class="px-4 py-3">Catégorie</th>
              <th class="px-4 py-3">Titre de l'annonce</th>
              <th class="px-4 py-3">Plateforme</th>
              <th class="px-4 py-3">Prix</th>
              <th class="px-4 py-3">Seuil</th>
              <th class="px-4 py-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="feed-container" class="divide-y divide-slate-800/60">
            <!-- Dynamique JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="border-t border-slate-800 bg-slate-900/50 py-4 text-center text-xs text-slate-500">
    <p>DealScanner Pro — Auto-refresh 10s actif</p>
  </footer>

  <script>
    lucide.createIcons();

    let feedData = [
      { id: 1, cat: 'pc', title: 'Kit evolution Ryzen 5 5600 + CM B550M + 32 Go DDR4 3600 MHz', price: 185, maxPrice: 220, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: true, tag: 'LOT 32GO', isFav: false },
      { id: 2, cat: 'new_add', title: 'Lot i5 12400F + Carte Mère B660M DDR4 + 32Go Corsair', price: 195, maxPrice: 220, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: true, tag: 'LOT INTEL', isFav: false },
      { id: 3, cat: 'new_add', title: 'Gigabyte Radeon RX 6750 XT Gaming OC 12Go', price: 225, maxPrice: 230, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: false, tag: 'RX 6750 XT', isFav: false },
      { id: 4, cat: 'pc', title: 'RAM Corsair Vengeance LPX 32Go (2x16Go) DDR4 3200MHz', price: 48, maxPrice: 55, platform: 'Vinted', link: 'https://vinted.fr', isJackpot: true, tag: 'RAM 32GO', isFav: true },
      { id: 5, cat: 'vinyl', title: 'Vinyle U2 - The Joshua Tree 33T Original', price: 14, maxPrice: 18, platform: 'Vinted', link: 'https://vinted.fr', isJackpot: true, tag: 'VINYLE U2', isFav: false },
      { id: 6, cat: 'new_add', title: 'Processeur AMD Ryzen 7 5700X Box', price: 99, maxPrice: 105, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: false, tag: 'CPU 8C', isFav: false },
      { id: 7, cat: 'vinyl', title: 'Linkin Park - Meteora Vinyle Album 2LP', price: 21, maxPrice: 22, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: false, tag: 'VINYLE LP', isFav: false }
    ];

    let currentCategory = 'all';
    let countdown = 10;

    function renderFeed() {
      const container = document.getElementById('feed-container');
      const search = document.getElementById('feed-search').value.toLowerCase();
      container.innerHTML = '';

      const filtered = feedData.filter(item => {
        const matchesCat = currentCategory === 'all' || (currentCategory === 'favorites' ? item.isFav : item.cat === currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(search) || item.platform.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      document.getElementById('active-count').innerText = `${filtered.length} annonces affichées`;
      document.getElementById('fav-counter').innerText = feedData.filter(i => i.isFav).length;

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition border-b border-slate-800/40';

        const favBtn = `<button onclick="toggleFav(${item.id})" class="text-slate-500 hover:text-amber-400 transition"><i data-lucide="star" class="w-4 h-4 ${item.isFav ? 'fill-amber-400 text-amber-400' : ''}"></i></button>`;
        const badgeStatut = item.isJackpot 
          ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">JACKPOT</span>`
          : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30">ALERTE</span>`;

        let catBadgeText = 'PC';
        let catBadgeClass = 'bg-slate-800 text-slate-300';
        if (item.cat === 'new_add') {
          catBadgeText = 'INTEL/GPU';
          catBadgeClass = 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/20';
        } else if (item.cat === 'vinyl') {
          catBadgeText = 'VINYLE';
          catBadgeClass = 'bg-amber-500/10 text-amber-300 border border-amber-500/20';
        }

        tr.innerHTML = `
          <td class="px-4 py-3">${favBtn}</td>
          <td class="px-4 py-3">${badgeStatut}</td>
          <td class="px-4 py-3"><span class="text-[10px] px-2 py-0.5 rounded ${catBadgeClass}">${catBadgeText}</span></td>
          <td class="px-4 py-3 font-medium text-white max-w-xs truncate">${item.title} <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 font-mono text-slate-300 ml-1">${item.tag}</span></td>
          <td class="px-4 py-3 text-slate-400">${item.platform}</td>
          <td class="px-4 py-3 font-bold text-emerald-400 text-sm">${item.price} €</td>
          <td class="px-4 py-3 text-slate-500 text-[11px]"><= ${item.maxPrice} €</td>
          <td class="px-4 py-3 text-right">
            <a href="${item.link}" target="_blank" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-sky-600 text-slate-200 hover:text-white rounded border border-slate-700 transition inline-flex items-center gap-1">
              Voir <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </td>
        `;
        container.appendChild(tr);
      });
      lucide.createIcons();
    }

    function switchCategory(cat) {
      currentCategory = cat;
      ['all', 'pc', 'new_add', 'vinyl', 'favorites'].forEach(c => {
        const btn = document.getElementById(`btn-cat-${c}`);
        if (c === cat) {
          btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white transition';
        } else {
          btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
        }
      });
      renderFeed();
    }

    function toggleFav(id) {
      const item = feedData.find(i => i.id === id);
      if (item) {
        item.isFav = !item.isFav;
        renderFeed();
      }
    }

    function manualReload() {
      countdown = 10;
      simulateNewAd();
    }

    function simulateNewAd() {
      const pool = [
        { id: Date.now(), cat: 'pc', title: 'Combo Ryzen 5 5600 + B550 Asus TUF + 32Go DDR4', price: 189, maxPrice: 220, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: true, tag: 'LOT 32GO', isFav: false },
        { id: Date.now(), cat: 'new_add', title: 'Lot i5 12600KF + ASUS B660M + 32Go RAM', price: 210, maxPrice: 220, platform: 'Leboncoin', link: 'https://leboncoin.fr', isJackpot: true, tag: 'LOT INTEL', isFav: false },
        { id: Date.now(), cat: 'new_add', title: 'Nvidia RTX 3060 Ti Founders Edition', price: 185, maxPrice: 200, platform: 'Rakuten', link: 'https://rakuten.com', isJackpot: true, tag: 'RTX 3060Ti', isFav: false },
        { id: Date.now(), cat: 'vinyl', title: 'Vinyle Coldplay - Parachutes Original 33T', price: 15, maxPrice: 18, platform: 'Vinted', link: 'https://vinted.fr', isJackpot: true, tag: 'VINYLE COLDPLAY', isFav: false }
      ];
      const randomItem = pool[Math.floor(Math.random() * pool.length)];
      feedData.unshift(randomItem);
      renderFeed();
    }

    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = 10;
        simulateNewAd();
      }
      document.getElementById('refresh-timer').innerText = `Prochain scan auto dans ${countdown}s`;
    }, 1000);

    renderFeed();
  </script>
</body>
</html>
